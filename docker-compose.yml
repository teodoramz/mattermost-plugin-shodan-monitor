# Local Mattermost for testing the Shodan Monitor plugin.
#
#   docker compose up -d
#   open http://localhost:8065
#
# Custom (unsigned) plugin uploads are enabled, so you can upload the bundle from
# System Console -> Plugins -> Plugin Management -> Upload Plugin.

name: shodan-monitor-dev

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser_password
      POSTGRES_DB: mattermost
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mattermost:
    image: mattermost/mattermost-team-edition:12.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mmuser_password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      # Local mode: lets `mmctl --local` administer the server from inside the container.
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      # Allow personal access tokens (handy for scripted testing).
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      # Plugins: allow uploading custom/unsigned plugins from the UI
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_PLUGINSETTINGS_REQUIREPLUGINSIGNATURE: "false"
      MM_PLUGINSETTINGS_AUTOMATICPREPACKAGEDPLUGINS: "true"
    volumes:
      - mm-config:/mattermost/config
      - mm-data:/mattermost/data
      - mm-logs:/mattermost/logs
      - mm-plugins:/mattermost/plugins
      - mm-client-plugins:/mattermost/client/plugins

volumes:
  pgdata:
  mm-config:
  mm-data:
  mm-logs:
  mm-plugins:
  mm-client-plugins:
